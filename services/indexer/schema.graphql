type Position {
  id: ID!
  tokenId: BigInt!
  owner: String @index
  kind: String!
  amount: BigInt!
  unlockEpoch: BigInt
  permanent: Boolean!
}

type Validator {
  id: ID!
  tokenId: BigInt!
  owner: String! @index
  operator: String
  validatorId: BigInt
  vault: String
  gauge: String
  bribe: String
  rewardToken: String
}

type DynamicRewardContract {
  id: ID!
  tokenId: BigInt!
  wallet: String
  kind: String!
  rewardToken: String
}

type Activity {
  id: ID!
  wallet: String @index
  tokenId: BigInt
  kind: String!
  amount: BigInt!
  secondaryAmount: BigInt
  relatedAddress: String
  secondaryAddress: String
  blockNumber: BigInt! @index
  logIndex: Int!
  timestamp: BigInt!
  transactionHash: String!
  epoch: BigInt
  cycle: BigInt
  success: Boolean
}
